<!DOCTYPE html>
<html>
	<head>
		 <meta charset="utf-8">
		    <title>个人意识</title>
		    <style>
		        body {
		            margin: 0;
		            padding: 50px; 
		            background-image: url("./img/背景图片.jpg");
		            background-size: cover;
		            background-repeat: no-repeat;
		            background-position: center;
		            min-height: 100vh;
		            box-sizing: border-box;
		        }
		        .content {
		            max-width: 800px;
		            margin: 0 auto;
		            color: #333;
		            line-height: 1.8;
		        }
			 .image-row {
			            display: flex;
			            justify-content: space-between;
			            gap: 20px; 
			            flex-wrap: wrap; 
			        }
			        .image-item {
			            flex: 1;
			            min-width: 250px;
			        }
			        .image-item img {
			            width: 100%;
			            height: auto;
			            border-radius: 8px;
			            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
			        }
			    </style>
			</head>
			<body>
		    </style>
		</head>
	<body>
		<h2>个人意识</h2>
		<hr>
		<p>我始终认为视觉设计不止是表面的美化，更是思想与情绪的视觉表达
		。设计源于生活，也服务于生活，我在创作中坚持以简洁干净的版式、协调舒适的色彩搭配为基础，
		注重整体层次与逻辑秩序，不盲目追逐潮流，用心做好原创与细节。
		我追求审美与实用兼具、艺术与理性平衡，拒绝多余的元素堆砌，让视觉为内容服务，用温和且有力量的画面传递情感与态度。
		在不断学习积累的同时保持独立思考，愿意在坚守自我风格的路上持续探索、不断突破，希望用自己的设计为生活赋予美感与温度。
</p>
	</body>

            </div>
            <div class="image-item">
            <img src="./img/个人意识2.jpg" alt="">
            </div>
            <div class="image-item">
             <img src="./img/个人意识3.jpg" alt="">
            </div>
</body>
</html>
